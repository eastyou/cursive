[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cursive"
version = "0.1.0"
description = "英文连笔字帖：四线三格、描摹行与空白练习行"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["handwriting", "cursive", "worksheet", "classroom", "printable", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]

[project.scripts]
cursive = "cursive.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/cursive"
Source = "https://github.com/eastyou/cursive"

[tool.setuptools]
packages = ["cursive"]
